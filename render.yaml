services:
  - type: web
    name: kandala-ultra-pair
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
    autoDeploy: true
    postBuildCommand: |
      echo "✅ KANDALA ULTRA deployment complete!"
      echo "📱 Access pair link endpoint: https://andrew-kandala-pair.onrender.com/api/pair-link"
